<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>绿色正方体</title>
<style>body{margin:0;overflow:hidden;background:#1a1a2e}
#info{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);color:#fff;background:rgba(0,0,0,0.6);padding:8px 20px;border-radius:20px;font-size:14px}
</style>
</head>
<body>
<div id="info">✨ 绿色正方体</div>
<script type="importmap">{"imports": {"three": "https://unpkg.com/three@0.128.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
const scene=new THREE.Scene(), camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,0.1,1000);camera.position.set(5,5,5);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);document.body.appendChild(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement);controls.autoRotate=true;controls.autoRotateSpeed=2.0;
scene.add(new THREE.AmbientLight(0x404060,0.5));const dirLight=new THREE.DirectionalLight(0xffffff,1);dirLight.position.set(3,10,5);scene.add(dirLight);
let geometry;
if('box' === 'sphere') geometry = new THREE.SphereGeometry(1, 16, 16);
else if('box' === 'cylinder') geometry = new THREE.CylinderGeometry(1, 1, 1.5, 16);
else geometry = new THREE.BoxGeometry(1.5, 1.5, 1.5);
const material=new THREE.MeshStandardMaterial({color:'#00ff00', roughness:0.4, metalness:0.6});
const mesh=new THREE.Mesh(geometry,material);scene.add(mesh);
function animate(){requestAnimationFrame(animate);controls.update();renderer.render(scene,camera);}animate();
window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
</script></html>
